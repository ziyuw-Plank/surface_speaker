name: Build SurfaceSpeaker APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 36 (hosted runner)
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.3.11579264'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build root-only native FIFO diagnostic (arm64)
        run: |
          mkdir -p app/src/main/assets
          "$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
            -O2 -Wall -Wextra -fPIE -pie \
            app/src/main/cpp/surface_fifo_probe.c -lm -o app/src/main/assets/native_fifo_arm64
          file app/src/main/assets/native_fifo_arm64
      - name: Assemble debug
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceSpeaker-v0.7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error